version: '3.7'

services:
  agro-api-mongo:
    build:
      context: ./mongo
      dockerfile: Dockerfile_mongo
    container_name: agro-api-mongo
    ports:
      - 27017:27017
    volumes:
      - ./mongo/mongo-init.js:/docker-entrypoint-initdb.d/init.js:ro
      - agro_api_mongo_data:/data/db:delegated
    environment:
      MONGO_INITDB_DATABASE: agro
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: rootPassword
      MONGO_USERNAME: localUser
      MONGO_PASSWORD: localPassword
    healthcheck:
      test: |
        if echo "rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27017'}]}).ok" | mongosh -u root -p rootPassword --quiet | grep -q 1; then
          exit 0
        elif echo "rs.status().ok" | mongosh -u root -p rootPassword --quiet | grep -q 1; then
          exit 0
        else
          exit 1
        fi
      interval: 10s
      start_period: 30s
      timeout: 10s
      retries: 3
    command:
      ['--replSet', 'rs0', '--bind_ip_all', '--keyFile', '/data/replica.key']

  agro-api-kafka:
    image: apache/kafka:3.9.1
    container_name: agro-api-kafka
    ports:
      - 9092:9092
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,HOST://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://agro-api-kafka:29092,HOST://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          '/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1 || exit 1'
        ]
      interval: 10s
      start_period: 30s
      timeout: 10s
      retries: 5

  agro-api-redis:
    image: redis:7.4-alpine
    container_name: agro-api-redis
    ports:
      - 6379:6379
    volumes:
      - agro_api_redis_data:/data
    command: ['redis-server', '--appendonly', 'no', '--save', '']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 3

  agro-api-kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:v1.3.0
    container_name: agro-api-kafka-ui
    ports:
      - '${KAFKA_UI_PORT:-8080}:8080'
    environment:
      DYNAMIC_CONFIG_ENABLED: 'true'
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: agro-api-kafka:29092
    depends_on:
      agro-api-kafka:
        condition: service_healthy

volumes:
  agro_api_mongo_data:
  agro_api_redis_data:
